<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f5f9;
      margin: 0;
      padding: 2rem 1rem;
      color: #222;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #1f4e82;
    }
    .campo {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }
    fieldset {
      border: 1px solid #ccc;
      border-radius: 4px;
      margin: 0 0 1.2rem 0;
      padding: 0.6rem 1rem 0.8rem;
    }
    legend {
      font-weight: bold;
      padding: 0 0.4rem;
    }
    fieldset label {
      display: inline-block;
      font-weight: normal;
      margin: 0 1rem 0 0.2rem;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #4a7fb5;
      border-color: #4a7fb5;
    }
    button {
      background: #1f4e82;
      color: #fff;
      border: none;
      padding: 0.7rem 1.6rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #163a61;
    }
  </style>
</head>
<body>
  <main>
    <h1>Formulario de Registro</h1>

    <form action="#" method="post">

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required tabindex="0">
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="Ej: correo@ejemplo.com" required tabindex="0">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required tabindex="0">
      </div>

      <fieldset>
        <legend>Género</legend>
        <input type="radio" id="masculino" name="genero" value="masculino" required tabindex="0">
        <label for="masculino">Masculino</label>

        <input type="radio" id="femenino" name="genero" value="femenino" tabindex="0">
        <label for="femenino">Femenino</label>

        <input type="radio" id="otro" name="genero" value="otro" tabindex="0">
        <label for="otro">Otro</label>
      </fieldset>

      <fieldset>
        <legend>Intereses</legend>
        <input type="checkbox" id="musica" name="intereses" value="musica" tabindex="0">
        <label for="musica">Música</label>

        <input type="checkbox" id="deporte" name="intereses" value="deporte" tabindex="0">
        <label for="deporte">Deporte</label>

        <input type="checkbox" id="lectura" name="intereses" value="lectura" tabindex="0">
        <label for="lectura">Lectura</label>

        <input type="checkbox" id="tecnologia" name="intereses" value="tecnologia" tabindex="0">
        <label for="tecnologia">Tecnología</label>
      </fieldset>

      <div class="campo">
        <label for="comentarios">Comentarios adicionales</label>
        <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribí acá cualquier comentario que quieras agregar" tabindex="0"></textarea>
      </div>

      <div class="campo">
        <label for="pais">País</label>
        <select id="pais" name="pais" required tabindex="0">
          <option value="">Seleccioná un país</option>
          <option value="argentina">Argentina</option>
          <option value="brasil">Brasil</option>
          <option value="chile">Chile</option>
          <option value="uruguay">Uruguay</option>
        </select>
      </div>

      <button type="submit" tabindex="0">Enviar</button>

    </form>
  </main>
</body>
</html>
